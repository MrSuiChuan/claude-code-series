<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1748">
<title>松夜城 — Song Night City</title>
<style>
:root {
  --bg-deep: #080e14;
  --water: #0d2b45;
  --water-bright: #144a6e;
  --city-warm: #3d2a1a;
  --city-mid: #4a3522;
  --city-bright: #6b4226;
  --forest: #1a2e1a;
  --forest-bright: #2a4a24;
  --road: #2a2824;
  --wall: #3a3832;
  --marker: #e8d498;
  --marker-glow: #f5e8c0;
  --label: #c4a060;
  --label-bright: #d4b878;
  --header-bg: #0a1628;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg-deep);color:#ccc;font-family:'Segoe UI',system-ui,sans-serif;
  overflow-x:hidden;width:1748px;margin:0 auto;
}

.header{
  background:var(--header-bg);border-bottom:1px solid #1a2d40;
  padding:0 40px;height:52px;display:flex;align-items:center;justify-content:space-between;
}
.header-left{display:flex;align-items:center;gap:32px}
.logo{font-size:16px;font-weight:700;color:#d4c8a0;letter-spacing:.5px}
.logo span{color:#8b9ab0;font-weight:400;margin-left:6px;font-size:13px}
.nav{display:flex;gap:24px;list-style:none}
.nav a{color:#6a7a8a;text-decoration:none;font-size:13px;transition:color .2s}
.nav a:hover,.nav a.active{color:#c4b080}
.header-right{display:flex;align-items:center;gap:14px;font-size:12px;color:#5a6a78}

.map-container{
  position:relative;width:1748px;height:847px;
  background:radial-gradient(ellipse at 65% 40%,#1a2530 0%,#0a1018 60%,#060a10 100%);
  overflow:hidden;
}
.map-container svg{width:100%;height:100%}

/* Legend */
.legend{
  position:absolute;bottom:24px;left:50%;transform:translateX(-50%);
  display:flex;gap:28px;background:rgba(10,18,28,.85);
  border:1px solid #1a2d40;border-radius:8px;padding:10px 24px;
  font-size:11px;color:#8a9aa8;
}
.legend-item{display:flex;align-items:center;gap:7px}
.legend-dot{width:8px;height:8px;border-radius:2px}

/* Tooltip */
.tooltip{
  display:none;position:absolute;
  background:rgba(10,18,28,.95);border:1px solid #c4a060;
  padding:6px 12px;border-radius:4px;font-size:12px;color:#d4c8a0;
  pointer-events:none;white-space:nowrap;z-index:10;
}
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <div class="logo">松夜城 <span>Song Night City</span></div>
    <ul class="nav">
      <li><a href="#" class="active">全图</a></li>
      <li><a href="#">内城</a></li>
      <li><a href="#">坊市</a></li>
      <li><a href="#">松江</a></li>
      <li><a href="#">松山</a></li>
    </ul>
  </div>
  <div class="header-right">松夜城全图 · 正式名称版</div>
</header>

<div class="map-container" id="map">

  <defs>

      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>

    <pattern id="forestPat" width="20" height="20" patternUnits="userSpaceOnUse">

      <circle cx="16" cy="6" r="1" fill="#3a6a30" opacity="0.2"/>

  </defs>

  <!-- === WATER BODIES === -->

  <path d="M80 120 Q120 180 100 260 Q70 350 90 440 Q110 520 80 600 Q60 680 100 760"

  <path d="M1680 200 Q1650 280 1670 360 Q1690 440 1660 520 Q1640 600 1670 700"

  <ellipse cx="1580" cy="420" rx="100" ry="180" fill="url(#forestPat)" stroke="#2a4a24" stroke-width="1" opacity="0.65"/>

  <ellipse cx="1300" cy="730" rx="200" ry="45" fill="url(#forestPat)" stroke="#2a4a24" stroke-width="1" opacity="0.5"/>

  <!-- === CITY GATES === -->

<div class="tooltip" id="tooltip"></div>

<script>
// Tooltip on marker hover
document.querySelectorAll('circle[filter]').forEach(circle => {
  circle.style.cursor = 'pointer';
  circle.addEventListener('mouseenter', e => {
    const label = circle.nextElementSibling;
    const tooltip = document.getElementById('tooltip');
    if (label && label.tagName === 'title') {
      tooltip.textContent = label.textContent;
      tooltip.style.display = 'block';
    }
  });
  circle.addEventListener('mousemove', e => {
    const tooltip = document.getElementById('tooltip');
    tooltip.style.left = (e.pageX + 14) + 'px';
    tooltip.style.top = (e.pageY - 30) + 'px';
  });
  circle.addEventListener('mouseleave', () => {
    document.getElementById('tooltip').style.display = 'none';
  });
});
</script>

</body>
