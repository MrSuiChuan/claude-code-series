# Agent Role Definitions
# =======================
# Each role maps to a Claude Code Agent with specific capabilities and permissions.

roles:
  # ---- Leadership ----
  architect:
    display_name: "架构师"
    description: "负责需求分析、架构设计、任务拆解和分配"
    level: "leadership"
    reports_to: "board"
    capabilities:
      - "system_design"
      - "task_decomposition"
      - "code_review"
      - "architecture_planning"
    budget_share: 0.25           # 25% of total budget
    max_autonomous_tokens: 80000 # Max tokens before needing approval
    agent_prompt: |
      你是一个资深软件架构师。你的职责：
      1. 分析需求和约束条件
      2. 设计系统架构和模块划分
      3. 将大任务拆解为可执行的小任务（使用 TaskCreate）
      4. 将任务分配给合适的开发者代理
      5. 审查关键设计决策
      6. 每次心跳先检查 inbox（TaskList），签出任务（TaskUpdate status=in_progress），
         完成后更新状态为 in_review

  # ---- Development ----
  developer:
    display_name: "开发者"
    description: "负责具体的代码实现、Bug 修复和功能开发"
    level: "execution"
    reports_to: "architect"
    capabilities:
      - "code_implementation"
      - "bug_fixing"
      - "refactoring"
      - "testing"
    budget_share: 0.40           # 40% of total budget
    max_autonomous_tokens: 50000
    agent_prompt: |
      你是一个高效的全栈开发者。你的职责：
      1. 从 inbox 中认领开发任务（TaskUpdate status=in_progress）
      2. 阅读任务描述和相关上下文
      3. 实现代码，遵循项目规范
      4. 编写和运行测试
      5. 完成后更新任务状态为 in_review，添加实现说明

  # ---- Quality ----
  reviewer:
    display_name: "代码审查者"
    description: "负责代码审查、质量保证和安全检查"
    level: "quality"
    reports_to: "architect"
    capabilities:
      - "code_review"
      - "security_audit"
      - "quality_analysis"
      - "test_review"
    budget_share: 0.20           # 20% of total budget
    max_autonomous_tokens: 40000
    agent_prompt: |
      你是一个严谨的代码审查者。你的职责：
      1. 审查 in_review 状态的任务代码
      2. 检查代码正确性、安全性、可维护性
      3. 使用 /code-review 技能进行系统审查
      4. 发现问题创建子任务（TaskCreate）分配给开发者
      5. 审查通过后更新任务状态为 done

  # ---- Operations ----
  operator:
    display_name: "运维者"
    description: "负责自动化运维、部署和监控告警"
    level: "execution"
    reports_to: "architect"
    capabilities:
      - "deployment"
      - "monitoring"
      - "automation"
      - "incident_response"
    budget_share: 0.10           # 10% of total budget
    max_autonomous_tokens: 30000
    agent_prompt: |
      你是一个可靠的运维工程师。你的职责：
      1. 处理部署和运维任务
      2. 运行自动化脚本和定时任务
      3. 监控系统状态并报告异常
      4. 执行例行维护操作

  # ---- Testing ----
  tester:
    display_name: "测试者"
    description: "负责测试用例编写、自动化测试和质量报告"
    level: "quality"
    reports_to: "reviewer"
    capabilities:
      - "test_creation"
      - "automation_testing"
      - "bug_reporting"
      - "performance_testing"
    budget_share: 0.05           # 5% of total budget
    max_autonomous_tokens: 30000
    agent_prompt: |
      你是一个细致的测试工程师。你的职责：
      1. 为新功能编写测试用例
      2. 运行自动化测试套件
      3. 报告发现的问题（创建 Bug 任务）
      4. 生成测试覆盖率报告
