# PaperClip Company Configuration
# ================================
# This file defines a "company" — a project or organization managed by AI agents.
# Generated by: paperclip-orchestrator / init_company.py

company:
  name: "example-project"
  display_name: "示例项目"
  mission: "使用 AI 代理协作完成软件开发任务"
  created_at: "2026-05-31"
  version: "0.1.0"

# Budget settings
budget:
  currency: "tokens"
  daily_limit: 500000      # Max tokens per day
  per_task_limit: 100000   # Max tokens per task
  alert_threshold: 0.8     # Alert at 80% of budget
  enforce: true            # Halt agents when budget exceeded

# Governance settings
governance:
  approval_required_for:
    - "budget_exceeded"        # Going over budget needs approval
    - "production_deploy"      # Deploying to production
    - "data_mutation"          # Destructive data operations
    - "external_api_call"      # Calling external services
  auto_approve:
    - "code_review"            # Code reviews are auto-approved
    - "test_execution"         # Running tests is auto-approved
  board_members: ["user"]      # Human board members

# Project milestones (managed via TaskCreate)
milestones:
  - name: "项目初始化"
    description: "搭建项目骨架和基础配置"
    order: 1
  - name: "核心功能开发"
    description: "实现核心业务逻辑"
    order: 2
  - name: "测试与审查"
    description: "完成测试覆盖和代码审查"
    order: 3
  - name: "发布上线"
    description: "部署到生产环境"
    order: 4
